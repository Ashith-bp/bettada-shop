<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | Bettada Estate</title>
<meta name="description" content="Browse coffee and black pepper from our Chikmagalur estate.">
<meta name="theme-color" content="#12301F">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<!--SEO-->
</head>
<body data-page="shop">
<a class="skip" href="#main">Skip to content</a>
<div id="siteHeader"></div>
<main id="main">
  <section class="band forest page-hero"><div class="wrap">
    <div id="crumbs"></div>
    <h1>Shop</h1>
    <p class="lede">Packs you can buy and pay for online, and bulk grades you can ask us to price.</p>
  </div></section>
  <section class="band bone tight"><div class="wrap">
    <div class="filters" role="search">
      <div class="row"><label class="sr" for="q" style="position:absolute;left:-999px">Search products</label><input id="q" type="search" placeholder="Search by name or grade, such as Peaberry or MG1" autocomplete="off"></div>
      <div class="row"><b>Collection</b><div class="pills" id="fCat"></div></div>
      <div class="row"><b>Show</b><div class="pills" id="fType"></div></div>
    </div>
    <p class="result-count" id="count" role="status"></p>
    <div class="pgrid" id="grid"></div>
  </div></section>
</main>
<div id="siteFooter"></div>
<script src="/js/shared.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
